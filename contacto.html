<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contacto — {nombre}</title><meta name="description" content="Contacto.">
<script>(function(){var t=localStorage.getItem("tema");if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t;})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="contacto">
<main id="main">

<div class="page-head"><div class="wrap"><p class="eyebrow">Hablemos</p><h1>Contacto</h1><p>Respondemos consultas sobre obras, enmarcado, envíos y formas de pago.</p></div></div>
<section><div class="wrap split" style="align-items:start">
<div><h2>Escribinos</h2><p>Completá el formulario y se abre WhatsApp con tu mensaje listo para enviar.</p>
<ul style="list-style:none;display:grid;gap:10px"><li><span class="eyebrow">WhatsApp</span><br><a data-wa="Hola! Quería hacer una consulta." target="_blank" rel="noopener" href="#">Enviar mensaje</a></li><li><span class="eyebrow">Mail</span><br><a data-mail href="#"></a></li></ul></div>
<form class="contact" id="contactForm"><label>Nombre<input name="nombre" required autocomplete="name"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Mensaje<textarea name="mensaje" rows="5" required></textarea></label><button class="btn" type="submit">Enviar por WhatsApp</button></form>
</div></section></main>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/supabase-config.js"></script>
<script type="module" src="js/public.js"></script>
</body>
</html>
