<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clásicos — {nombre}</title><meta name="description" content="Muestra de obras clásicas de dominio público. No están a la venta.">
<script>(function(){var t=localStorage.getItem("tema");if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t;})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preload" as="image" href="img/prueba/port-lopez.jpg" fetchpriority="high">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112..125,400..600&family=Inter:wght@300;400;500&display=swap">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/artistas-v2.css">
<link rel="stylesheet" href="css/clasicos-v2.css">
</head>
<body data-page="clasicos" class="pg ar-page cl-page" data-test data-boot="now">
<main id="main">

<!-- Maestros argentinos: miniaturas, nombre, datos y retrato; debajo, sus obras (mismo diseño que Artistas) -->
<section class="ar-hero" id="arHero" data-src="maestros" aria-labelledby="arH">
 <div class="ar-in">
  <h1 class="ar-h" id="arH"><span data-en="Classics">Clásicos</span><i aria-hidden="true"></i><span data-en="Argentine masters">Maestros argentinos</span><i aria-hidden="true"></i><span class="ar-count" id="arCount" data-no-i18n></span></h1>
  <div class="ar-rail" id="arRail" role="tablist" aria-orientation="vertical" data-en-label="Choose an artist" aria-label="Elegí un artista" data-no-i18n></div>
  <div class="ar-stage" id="arStage" aria-hidden="true"></div>
  <div class="ar-info" id="arInfo" role="tabpanel" aria-live="polite" data-no-i18n></div>
 </div>
</section>
<section class="ar-row" aria-label="Obras del artista"><h2 class="ar-row-h" id="arRowH" data-no-i18n></h2><div class="ar-row-g" id="arRow" data-no-i18n></div></section>

<!-- Sala internacional: obras maestras de dominio público, una por vez, centradas -->
<section class="cl-room" id="sala" aria-labelledby="clRoomH">
 <header class="cl-room-head">
  <p class="cl-room-k"><span data-en="International room">Sala internacional</span><i aria-hidden="true"></i><span class="cl-room-c" id="clRoomC" data-no-i18n></span></p>
  <h2 class="cl-room-h" id="clRoomH" data-en="Masterpieces of art history">Obras maestras de la historia del arte</h2>
  <p class="cl-room-p" data-en="Great works from the world's museums, all in the public domain. A showcase to look at slowly.">Grandes obras de los museos del mundo, todas de dominio público. Una muestra para mirar con calma.</p>
  <p class="ar-pd" data-en="Showcase · Public domain · Not for sale">Muestra · Dominio público · No a la venta</p>
 </header>
 <ol class="cl-room-list" id="clRoom" data-no-i18n></ol>
</section>
</main>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/maestros.js"></script>
<script src="js/clasicos.js"></script>
<script src="js/app.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/pages.js"></script>
<script src="js/artistas-v2.js"></script>
<script src="js/clasicos-v2.js"></script>
<script type="module" src="js/pages-boot.js"></script>
</body>
</html>
