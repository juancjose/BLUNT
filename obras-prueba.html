<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Obras — {nombre}</title><meta name="description" content="Catálogo de obras originales.">
<script>(function(){var t=localStorage.getItem("tema");if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t;})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112..125,400..600&family=Inter:wght@300;400;500&display=swap">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/pages-prueba.css">
</head>
<body data-page="obras" class="pg" data-boot="data">
<main id="main">

<section class="pg-head pg-obras" aria-labelledby="pgT">
<div class="wrap">
<p class="pg-kicker pg-in" style="--k:0"><span data-en="Catalog">Catálogo</span><i class="pg-dot" aria-hidden="true"></i><span data-en="Original art">Obra original</span></p>
<div class="pg-row"><h1 class="pg-title" id="pgT" data-en="Works">Obras</h1><p class="pg-count pg-in" id="pgCount" style="--k:2" aria-live="polite"></p></div>
<div class="pg-row pg-row-sub"><p class="pg-sub pg-in" style="--k:3" data-en="One-of-a-kind pieces and limited editions by Argentine artists. Prices in US dollars.">Piezas únicas y ediciones limitadas de artistas argentinos. Precios en dólares estadounidenses.</p>
<a class="pg-jump pg-in" style="--k:4" href="#catalogo"><span data-en="Browse the catalog">Ver el catálogo</span><i aria-hidden="true">↓</i></a></div>
</div>
<div class="pg-strip pg-in" style="--k:4" id="pgStrip" aria-hidden="true"></div>
<p class="wrap pg-strip-note pg-in" style="--k:5" id="pgStripNote" data-en="Until the first works arrive: a showcase of classics and Argentine masters · Public domain · Not for sale">Mientras llegan las primeras obras: muestra de clásicos y maestros argentinos · Dominio público · No a la venta</p>
</section>
<section id="catalogo" class="pg-sec-first"><div class="wrap">
<div class="sec-head" style="margin-bottom:24px;align-items:center"><div class="filters" id="filters" role="group" aria-label="Filtrar por artista" style="margin:0"></div>
<div style="display:flex;gap:16px;align-items:center"><span class="muted" id="count" aria-live="polite"></span><label style="display:flex;align-items:center;gap:8px">Ordenar<select class="sort" id="sort"><option value="">Recientes</option><option value="asc">Menor precio</option><option value="desc">Mayor precio</option></select></label></div></div>
<div class="grid" id="catalog"></div></div></section></main>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/clasicos.js"></script>
<script src="js/maestros.js"></script>
<script src="js/app.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/pages-prueba.js"></script>
<script type="module" src="js/pages-prueba-boot.js"></script>

</html>
